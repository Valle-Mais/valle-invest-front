@if (open()) {
  <div class="fixed inset-0 z-40 bg-black/50 transition-opacity" (click)="close()"></div>
}

<aside
  class="fixed inset-y-0 right-0 z-50 w-full max-w-md bg-surface-raised shadow-2xl flex flex-col transform transition-transform duration-300 ease-in-out"
  [class.translate-x-0]="open()"
  [class.translate-x-full]="!open()"
  role="dialog"
  aria-modal="true"
  [attr.aria-hidden]="!open()"
  [attr.aria-label]="title()"
>
  <header class="flex items-center justify-between gap-4 px-5 py-4 border-b border-border">
    <h2 class="text-xl font-bold text-text truncate">{{ title() }}</h2>
    <button vl-button variant="ghost" size="sm" type="button" (click)="close()" aria-label="Fechar">
      <lucide-icon name="x" [size]="20" />
    </button>
  </header>

  <div class="flex-1 overflow-y-auto p-5">
    <ng-content />
  </div>

  <footer class="px-5 py-4 border-t border-border bg-surface-alt/40 empty:hidden">
    <ng-content select="[footer]" />
  </footer>
</aside>
