<vl-drawer [open]="open()" (openChange)="open.set($event)" [title]="title()">
  <form id="admin-tx-form" class="space-y-5" (ngSubmit)="save()">
    @if (!lockedClientId()) {
      <vl-field label="Cliente" inputId="tx-client" [required]="true">
        <select vlInput id="tx-client" name="clientId" required [(ngModel)]="clientId" [disabled]="isEdit()">
          <option value="" disabled>Selecione</option>
          @for (c of activeClients(); track c.id) {
            <option [value]="c.id">{{ c.name }}</option>
          }
        </select>
      </vl-field>
    }
    <div class="grid grid-cols-2 gap-4">
      <vl-field label="Tipo" inputId="tx-tipo">
        <select vlInput id="tx-tipo" name="tipo" [(ngModel)]="tipo">
          <option value="Aporte">Aporte</option>
          <option value="Resgate">Resgate</option>
        </select>
      </vl-field>
      <vl-field label="Data" inputId="tx-data" [required]="true">
        <input vlInput id="tx-data" name="data" type="date" required [(ngModel)]="data" />
      </vl-field>
    </div>
    <vl-field label="Valor (R$)" inputId="tx-valor" [required]="true">
      <input vlInput id="tx-valor" name="valor" type="number" step="0.01" min="0.01" inputmode="decimal" required [(ngModel)]="valor" />
    </vl-field>
    <p class="text-xs text-text-muted">
      {{ isEdit() ? 'Alterar valor ou data de uma transação aprovada reprocessa os rendimentos a partir dela.' : 'Entra como aprovado: o saldo do cliente é atualizado na hora e, se a data for retroativa, os rendimentos são reprocessados.' }}
    </p>
    @if (error()) {
      <div class="p-3 text-sm rounded-lg bg-negative-soft text-negative" role="alert">{{ error() }}</div>
    }
  </form>
  <div footer class="flex justify-end gap-2">
    <button vl-button variant="secondary" type="button" (click)="open.set(false)">Cancelar</button>
    <button vl-button type="submit" form="admin-tx-form" [loading]="saving()">{{ isEdit() ? 'Salvar alterações' : 'Registrar' }}</button>
  </div>
</vl-drawer>
