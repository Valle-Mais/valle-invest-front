<div class="space-y-8">
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-3xl font-bold text-slate-800 dark:text-white">Gestão de Ativos</h1>
      <p class="text-slate-500 dark:text-slate-400">Adicione, edite ou remova os ativos disponíveis na plataforma.</p>
    </div>
    <button (click)="openAddAssetModal()" class="flex items-center gap-2 px-4 py-2 text-sm font-semibold bg-sv-green text-white rounded-lg hover:bg-sv-green-light transition-colors shadow">
      <svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>
      <span>Adicionar Ativo</span>
    </button>
  </div>

  <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800">
    <div class="overflow-x-auto">
      <table class="w-full text-sm text-left">
        <thead class="bg-slate-50 dark:bg-slate-800 text-xs text-slate-500 dark:text-slate-400 uppercase">
          <tr>
            <th class="px-6 py-3">Ticker</th>
            <th class="px-6 py-3">Nome</th>
            <th class="px-6 py-3">Tipo</th>
            <th class="px-6 py-3 text-right">Ações</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-200 dark:divide-slate-800">
          <tr *ngFor="let asset of allAssets">
            <td class="px-6 py-4 font-mono font-semibold text-slate-800 dark:text-white">{{ asset.ticker }}</td>
            <td class="px-6 py-4 text-slate-600 dark:text-slate-300">{{ asset.name }}</td>
            <td class="px-6 py-4 text-slate-500 dark:text-slate-400">{{ asset.type }}</td>
            <td class="px-6 py-4 text-right">
              <div class="flex justify-end items-center gap-2">
                <button (click)="openEditAssetModal(asset)" class="p-2 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-md">
                   <svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.5L16.732 3.732z" /></svg>
                </button>
                <button (click)="deleteAsset(asset.id)" class="p-2 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-md">
                   <svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" class="h-4 w-4 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<app-asset-form
  [isOpen]="isAssetFormOpen"
  [assetToEdit]="assetToEdit"
  (close)="closeAssetForm()"
  (save)="saveAsset($event)">
</app-asset-form>
