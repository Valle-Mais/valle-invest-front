<div class="flex min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-300 font-sans">

  <div *ngIf="isMobileMenuOpen()"
       (click)="isMobileMenuOpen.set(false)"
       class="fixed inset-0 bg-black/30 z-20 lg:hidden"></div>

  <aside [class.translate-x-0]="isMobileMenuOpen()"
         [class.-translate-x-full]="!isMobileMenuOpen()"
         class="fixed top-0 left-0 z-30 w-64 h-full bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col transform transition-transform duration-300 ease-in-out lg:translate-x-0">

<div class="h-40 flex items-center justify-center border-b border-slate-200 dark:border-slate-800 mt-4 mb-2">
  <img
    src="android-chrome-512x512.png"
    alt="Valle Admin Logo"
    class="h-40 w-auto"
  />
</div>


    <nav class="flex-1 overflow-y-auto px-4 py-6 space-y-2">
      <a routerLink="dashboard" routerLinkActive="bg-emerald-600 text-white" [routerLinkActiveOptions]="{exact: true}"
         class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-colors">
        Dashboard
      </a>

      <a routerLink="client-view" routerLinkActive="bg-emerald-600 text-white"
         class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-colors">
        Visão do Cliente
      </a>

      <a routerLink="clients" routerLinkActive="bg-emerald-600 text-white"
         class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-colors">
        Usuários
      </a>

      <a routerLink="fund-operations" routerLinkActive="bg-emerald-600 text-white"
         class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-colors">
        Operações do Fundo
      </a>

      <a routerLink="client-transactions" routerLinkActive="bg-emerald-600 text-white"
         class="flex items-center justify-between gap-3 px-4 py-2.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-colors">
        <div class="flex items-center gap-3">
          Aportes/Resgates
        </div>
        <ng-container *ngIf="(pendingCount$ | async) as count">
          <span *ngIf="count > 0" class="flex items-center justify-center h-5 w-5 text-xs font-semibold text-white bg-red-500 rounded-full">
            {{ count }}
          </span>
        </ng-container>
      </a>
    </nav>

    <div class="p-4 border-t border-slate-200 dark:border-slate-800">
      <button (click)="logout()" class="flex items-center gap-3 w-full text-left px-4 py-2.5 rounded-lg text-red-500 hover:bg-red-500/10 transition-colors">
        Sair
      </button>
    </div>
  </aside>

  <div class="flex-1 flex flex-col overflow-hidden lg:ml-64">
    <header class="h-20 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-4 sm:px-8">
      <button (click)="isMobileMenuOpen.set(true)" class="lg:hidden text-slate-500 dark:text-slate-400">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <div class="hidden lg:block"></div>

      <div class="flex items-center space-x-4 sm:space-x-6">
        <div class="flex items-center space-x-3">
          <img src="https://placehold.co/40x40/1E462E/F0EAD6?text=A" class="w-10 h-10 rounded-full" alt="Admin Avatar" />
          <div>
            <div class="font-bold text-slate-800 dark:text-slate-100">Admin</div>
            <div class="text-xs text-slate-500">Administrador</div>
          </div>
        </div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 sm:p-8">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
