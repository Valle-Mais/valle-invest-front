<div class="max-w-2xl space-y-6">
  <vl-page-header title="Perfil" subtitle="Seus dados e preferências." />

  <form class="rounded-xl border border-border bg-surface-raised p-6 space-y-5" (ngSubmit)="save()">
    <h2 class="text-lg font-bold text-text">Dados de contato</h2>
    <vl-field label="Nome" inputId="p-name" hint="Para alterar nome ou email, fale com a Valle Consultoria.">
      <input vlInput id="p-name" type="text" [value]="user()?.name || ''" disabled />
    </vl-field>
    <vl-field label="Email" inputId="p-email">
      <input vlInput id="p-email" type="email" [value]="user()?.email || ''" disabled />
    </vl-field>
    <vl-field label="Telefone" inputId="p-phone" hint="Opcional. Usado só para contato da Valle com você.">
      <input vlInput id="p-phone" name="phone" type="tel" inputmode="tel" placeholder="(11) 99999-9999" maxlength="30" [(ngModel)]="phone" />
    </vl-field>
    <button vl-button type="submit" [loading]="saving()">Salvar</button>
  </form>

  <section class="rounded-xl border border-border bg-surface-raised p-6 space-y-4">
    <h2 class="text-lg font-bold text-text">Preferências e acesso</h2>
    <div class="flex flex-wrap gap-3">
      <button vl-button variant="secondary" type="button" (click)="theme.toggleTheme()">
        <lucide-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" [size]="16" />
        {{ theme.theme() === 'dark' ? 'Usar tema claro' : 'Usar tema escuro' }}
      </button>
      <a vl-button variant="secondary" routerLink="../alterar-senha">
        <lucide-icon name="key-round" [size]="16" />Alterar senha
      </a>
      <button vl-button variant="danger" type="button" (click)="logout()">
        <lucide-icon name="log-out" [size]="16" />Sair
      </button>
    </div>
  </section>
</div>
