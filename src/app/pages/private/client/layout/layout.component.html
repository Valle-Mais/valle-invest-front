<div class="relative min-h-full lg:flex bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-300 font-sans">

  <!-- Overlay para o menu móvel -->
  <div *ngIf="isMobileMenuOpen()" (click)="isMobileMenuOpen.set(false)" class="fixed inset-0 bg-black/30 z-20 lg:hidden"></div>

  <!-- Menu Lateral (Sidebar) -->
  <aside
    class="fixed top-0 left-0 h-full w-64 flex-shrink-0 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col z-30 transition-transform duration-300 ease-in-out lg:static lg:translate-x-0"
    [class.-translate-x-full]="!isMobileMenuOpen()">
    <!-- Logo -->
<div class="h-40 flex items-center justify-center border-b border-slate-200 dark:border-slate-800 mt-4 mb-2">
  <img
    src="android-chrome-512x512.png"
    alt="Valle Admin Logo"
    class="h-64 w-auto"
  />
</div>
    <!-- Navegação -->
    <nav class="flex-grow px-4 py-6 space-y-2">
      <a routerLink="dashboard" routerLinkActive="bg-sv-green text-white" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-colors">
        <svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
        <span>Meu Painel</span>
      </a>
      <a routerLink="statement" routerLinkActive="bg-sv-green text-white" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-colors">
        <svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
        <span>Extrato Financeiro</span>
      </a>
      <a routerLink="operations" routerLinkActive="bg-sv-green text-white" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-colors">
        <svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
        <span>Relação de Operações</span>
      </a>
    </nav>
    <!-- Rodapé do Menu -->
    <div class="p-4 border-t border-slate-200 dark:border-slate-800">
      <button (click)="logout()" class="flex items-center gap-3 w-full text-left px-4 py-2.5 rounded-lg text-red-500 hover:bg-red-500/10 transition-colors">
        <svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
        <span>Sair</span>
      </button>
    </div>
  </aside>

  <!-- Área de Conteúdo Principal -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Cabeçalho Superior -->
    <header class="h-20 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-4 sm:px-8">
      <!-- Botão Hamburger (visível em mobile) -->
      <button (click)="isMobileMenuOpen.set(true)" class="lg:hidden text-slate-500 dark:text-slate-400">
        <svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
      </button>
      <!-- Título da Página (escondido em mobile para dar espaço) -->
      <div class="hidden sm:block">
        <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100">Meu Painel</h2>
      </div>
      <!-- Botões de Ação e Menu do Utilizador -->
      <div class="flex items-center space-x-4 sm:space-x-6">
        <button class="px-3 sm:px-4 py-2 text-xs sm:text-sm font-semibold bg-sv-green/10 text-sv-green dark:bg-sv-green/20 dark:text-white rounded-lg">Aportar</button>
        <button class="px-3 sm:px-4 py-2 text-xs sm:text-sm font-semibold bg-slate-200 dark:bg-slate-700 rounded-lg">Resgatar</button>
        <div class="hidden sm:flex items-center space-x-3">
          <div class="w-10 h-10 rounded-full bg-sv-gold flex items-center justify-center text-sv-green font-bold">
            {{ userInitials() }}
          </div>
          <div>
            <div class="font-bold text-slate-800 dark:text-slate-100">{{ userName() }}</div>
            <div class="text-xs text-slate-500">Cliente</div>
          </div>
        </div>
      </div>
    </header>
    <!-- Conteúdo da Página -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 sm:p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
