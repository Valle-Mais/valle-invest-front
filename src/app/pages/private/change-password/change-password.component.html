<div class="max-w-lg space-y-6">
  <vl-page-header title="Alterar senha" [subtitle]="policyMessage" />

  <form class="bg-surface-raised rounded-xl border border-border p-6 space-y-5" (ngSubmit)="submit()">
    <vl-field label="Senha atual" inputId="currentPassword">
      <input vlInput id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required [(ngModel)]="currentPassword" />
    </vl-field>
    <vl-field label="Nova senha" inputId="newPassword">
      <input vlInput id="newPassword" name="newPassword" type="password" autocomplete="new-password" required minlength="8" [(ngModel)]="newPassword" />
    </vl-field>
    <vl-field label="Confirmar nova senha" inputId="confirm">
      <input vlInput id="confirm" name="confirm" type="password" autocomplete="new-password" required [(ngModel)]="confirm" />
    </vl-field>

    @if (errorMessage()) {
      <div class="p-3 text-sm rounded-lg bg-negative-soft text-negative" role="alert">{{ errorMessage() }}</div>
    }
    @if (successMessage()) {
      <div class="p-3 text-sm rounded-lg bg-positive-soft text-positive">{{ successMessage() }}</div>
    }

    <button vl-button type="submit" [loading]="isLoading()">Salvar nova senha</button>
  </form>
</div>
