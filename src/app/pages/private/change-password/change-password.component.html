<div class="max-w-lg space-y-6 font-sans">
  <div>
    <h1 class="text-3xl font-bold text-slate-800 dark:text-white">Alterar senha</h1>
    <p class="text-slate-500 dark:text-slate-400">{{ policyMessage }}</p>
  </div>

  <form class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 p-6 space-y-5" (ngSubmit)="submit()">
    <div>
      <label for="currentPassword" class="block mb-2 text-sm font-medium text-slate-700 dark:text-slate-300">Senha atual</label>
      <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required [(ngModel)]="currentPassword"
             class="bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 text-slate-900 dark:text-white text-sm rounded-lg focus:ring-2 focus:ring-sv-gold block w-full p-2.5" />
    </div>
    <div>
      <label for="newPassword" class="block mb-2 text-sm font-medium text-slate-700 dark:text-slate-300">Nova senha</label>
      <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required minlength="8" [(ngModel)]="newPassword"
             class="bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 text-slate-900 dark:text-white text-sm rounded-lg focus:ring-2 focus:ring-sv-gold block w-full p-2.5" />
    </div>
    <div>
      <label for="confirm" class="block mb-2 text-sm font-medium text-slate-700 dark:text-slate-300">Confirmar nova senha</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" required [(ngModel)]="confirm"
             class="bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 text-slate-900 dark:text-white text-sm rounded-lg focus:ring-2 focus:ring-sv-gold block w-full p-2.5" />
    </div>

    @if (errorMessage()) {
      <div class="p-3 text-sm text-red-700 bg-red-100 dark:bg-red-900/30 dark:text-red-400 rounded-lg">{{ errorMessage() }}</div>
    }
    @if (successMessage()) {
      <div class="p-3 text-sm text-green-800 bg-green-100 dark:bg-green-900/30 dark:text-green-300 rounded-lg">{{ successMessage() }}</div>
    }

    <button type="submit" [disabled]="isLoading()"
            class="py-2.5 px-5 text-sm font-bold rounded-lg text-white bg-sv-green hover:bg-sv-green-light disabled:bg-slate-400">
      {{ isLoading() ? 'Salvando...' : 'Salvar nova senha' }}
    </button>
  </form>
</div>
