<div
  *ngIf="isOpen"
  (click)="onClose()"
  class="fixed inset-0 bg-black/40 z-40 transition-opacity"
  [class.opacity-100]="isOpen"
  [class.opacity-0]="!isOpen">
</div>

<!-- Painel Lateral -->
<aside
  class="fixed top-0 right-0 h-full w-full max-w-md bg-white dark:bg-slate-900 z-50 shadow-2xl transition-transform duration-300 ease-in-out"
  [class.translate-x-0]="isOpen"
  [class.translate-x-full]="!isOpen">

  <div class="flex flex-col h-full">
    <!-- Cabeçalho do Modal -->
    <header class="h-20 flex items-center justify-between px-6 border-b border-slate-200 dark:border-slate-800 flex-shrink-0">
      <h2 class="text-xl font-bold text-slate-800 dark:text-white">
        {{ isEditMode ? 'Editar Utilizador' : 'Adicionar Novo Utilizador' }}
      </h2>
      <button (click)="onClose()" class="p-2 rounded-full text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">
        <svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </header>

    <!-- Formulário -->
    <main class="flex-grow p-6 overflow-y-auto">
      <form class="space-y-6" #userForm="ngForm">
        <!-- Campo Nome -->
        <div>
          <label for="name" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Nome Completo</label>
          <div class="mt-1">
            <input type="text" id="name" name="name" [(ngModel)]="user.name" required class="w-full px-4 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-sv-green">
          </div>
        </div>
        <!-- Campo Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Email</label>
          <div class="mt-1">
            <input type="email" id="email" name="email" [(ngModel)]="user.email" required [disabled]="isEditMode" class="w-full px-4 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-sv-green disabled:bg-slate-200 dark:disabled:bg-slate-700">
          </div>
        </div>
        <!-- Campo Tipo de Utilizador (apenas para novos utilizadores) -->
        <div *ngIf="!isEditMode">
          <label for="role" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Tipo de Utilizador</label>
          <div class="mt-1">
            <select id="role" name="role" [(ngModel)]="user.role" class="w-full px-4 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-sv-green">
              <option value="client">Cliente</option>
              <option value="admin">Admin</option>
            </select>
          </div>
        </div>
        <!-- Campo Status (apenas para edição) -->
        <div *ngIf="isEditMode">
          <label for="status" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Status</label>
          <div class="mt-1">
            <select id="status" name="status" [(ngModel)]="user.status" class="w-full px-4 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-sv-green">
              <option value="Ativo">Ativo</option>
              <option value="Inativo">Inativo</option>
            </select>
          </div>
        </div>
      </form>
    </main>

    <!-- Rodapé com Ações -->
    <footer class="flex-shrink-0 p-6 border-t border-slate-200 dark:border-slate-800 flex justify-end items-center gap-4">
      <button (click)="onClose()" class="px-4 py-2 text-sm font-semibold text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700">
        Cancelar
      </button>
      <button (click)="onSave()" [disabled]="!userForm.valid" class="px-4 py-2 text-sm font-semibold text-white bg-sv-green rounded-lg hover:bg-sv-green-light disabled:bg-slate-400 disabled:cursor-not-allowed">
        {{ isEditMode ? 'Salvar Alterações' : 'Criar Utilizador' }}
      </button>
    </footer>
  </div>
</aside>
