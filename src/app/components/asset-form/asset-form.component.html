<div *ngIf="isOpen" (click)="onClose()" class="fixed inset-0 bg-black/40 z-40"></div>
<aside class="fixed top-0 right-0 h-full w-full max-w-md bg-white dark:bg-slate-900 z-50 shadow-2xl transition-transform duration-300 ease-in-out" [class.translate-x-0]="isOpen" [class.translate-x-full]="!isOpen">
  <div class="flex flex-col h-full">
    <header class="h-20 flex items-center justify-between px-6 border-b border-slate-200 dark:border-slate-800">
      <h2 class="text-xl font-bold text-slate-800 dark:text-white">{{ isEditMode ? 'Editar Ativo' : 'Adicionar Novo Ativo' }}</h2>
      <button (click)="onClose()" class="p-2 rounded-full text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </header>
    <main class="flex-grow p-6 overflow-y-auto">
      <form class="space-y-6" #assetForm="ngForm">
        <div>
          <label for="ticker" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Ticker</label>
          <input type="text" id="ticker" name="ticker" [(ngModel)]="asset.ticker" required [disabled]="isEditMode" placeholder="Ex: PETR4" class="w-full uppercase px-4 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg disabled:bg-slate-200 dark:disabled:bg-slate-700">
        </div>
        <div>
          <label for="name" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Nome da Empresa</label>
          <input type="text" id="name" name="name" [(ngModel)]="asset.name" required placeholder="Ex: Petróleo Brasileiro S.A." class="w-full px-4 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg">
        </div>
        <div>
          <label for="type" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Tipo de Ativo</label>
          <select id="type" name="type" [(ngModel)]="asset.type" class="w-full px-4 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg">
            <option>Ação</option>
            <option>FII</option>
            <option>BDR</option>
            <option>ETF</option>
          </select>
        </div>
      </form>
    </main>
    <footer class="p-6 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-4">
      <button (click)="onClose()" class="px-4 py-2 text-sm font-semibold rounded-lg border">Cancelar</button>
      <button (click)="onSave()" [disabled]="!assetForm.valid" class="px-4 py-2 text-sm font-semibold text-white bg-sv-green rounded-lg disabled:opacity-50">
        {{ isEditMode ? 'Salvar Alterações' : 'Criar Ativo' }}
      </button>
    </footer>
  </div>
</aside>
